name: Esconde-Esconde
version: 1.1.0
main: br.com.notedarck.esconde.EscondeEscondePlugin
api-version: '26.2'
author: NoteDarck
description: Minigame de esconde-esconde inspirado em servidores de minigames.
commands:
  esconde:
    description: Controla o minigame de esconde-esconde.
    aliases: [hide, escondeesconde]
    usage: /esconde <entrar|sair|iniciar|parar|set|status|reload>
permissions:
  esconde.admin:
    description: Permite configurar e controlar partidas.
    default: op
