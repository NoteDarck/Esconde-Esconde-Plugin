# Itens do Esconde-Esconde.
# Ações disponíveis ao clicar:
#   [COMMAND] comando       executa como o jogador
#   [CONSOLE] comando       executa pelo console
#   [MESSAGE] mensagem      envia mensagem ao jogador
#   [LEAVE]                 remove o jogador da arena
#   [RETURN]                envia ao ponto exit da arena ou ao lobby
# Placeholders: %player%, %arena%
items:
