    enabled: true
    material: BARRIER
    amount: 1
    name: '&cSair do Esconde-Esconde'
    lore:
      - '&7Clique para sair da fila ou da partida.'
    slot: 8
    allow-move: false
    allow-drop: false
    click: ANY
    actions:
